<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>书签分类启动器</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup-shell" id="app" data-column-count="1" data-depth="0">
      <header class="topbar">
        <label class="search-field">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M10.6 5.2a5.4 5.4 0 1 1 0 10.8 5.4 5.4 0 0 1 0-10.8Zm0-1.8a7.2 7.2 0 1 0 4.43 12.87l3.35 3.35a1.05 1.05 0 0 0 1.49-1.48l-3.35-3.36A7.2 7.2 0 0 0 10.6 3.4Z"/>
            </svg>
          </span>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索书签">
        </label>
        <button class="icon-button" id="themeButton" type="button" title="切换主题色" aria-label="切换主题色">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 3a9 9 0 0 0 0 18h1.15a2.65 2.65 0 0 0 1.83-4.57 1.06 1.06 0 0 1 .73-1.83h1.39A3.9 3.9 0 0 0 21 10.7C21 6.45 16.97 3 12 3Zm-4.25 9.75a1.35 1.35 0 1 1 0-2.7 1.35 1.35 0 0 1 0 2.7Zm2.05-4.2a1.35 1.35 0 1 1 0-2.7 1.35 1.35 0 0 1 0 2.7Zm4.4 0a1.35 1.35 0 1 1 0-2.7 1.35 1.35 0 0 1 0 2.7Zm2.05 4.2a1.35 1.35 0 1 1 0-2.7 1.35 1.35 0 0 1 0 2.7Z"/>
          </svg>
        </button>
        <button class="icon-button" id="syncButton" type="button" title="同步浏览器书签" aria-label="同步浏览器书签">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M7.1 7.6A6.4 6.4 0 0 1 18 10.9a1 1 0 1 0 2 0A8.4 8.4 0 0 0 5.68 4.96L4.71 4A1 1 0 0 0 3 4.71V8a1 1 0 0 0 1 1h3.29A1 1 0 0 0 8 7.29Zm9.8 8.8A6.4 6.4 0 0 1 6 13.1a1 1 0 1 0-2 0 8.4 8.4 0 0 0 14.32 5.94l.97.96A1 1 0 0 0 21 19.29V16a1 1 0 0 0-1-1h-3.29a1 1 0 0 0-.71 1.71Z"/>
          </svg>
        </button>
        <button class="icon-button" id="settingsButton" type="button" title="后台设置（预留）" aria-label="后台设置（预留）">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm0-5.5a1 1 0 0 1 .98.8l.33 1.63c.5.17.98.37 1.43.62l1.38-.92a1 1 0 0 1 1.26.12l1.37 1.37a1 1 0 0 1 .12 1.26l-.92 1.38c.25.45.45.93.62 1.43l1.63.33a1 1 0 0 1 .8.98v2a1 1 0 0 1-.8.98l-1.63.33c-.17.5-.37.98-.62 1.43l.92 1.38a1 1 0 0 1-.12 1.26l-1.37 1.37a1 1 0 0 1-1.26.12l-1.38-.92c-.45.25-.93.45-1.43.62l-.33 1.63a1 1 0 0 1-.98.8h-2a1 1 0 0 1-.98-.8l-.33-1.63a7.86 7.86 0 0 1-1.43-.62l-1.38.92a1 1 0 0 1-1.26-.12l-1.37-1.37a1 1 0 0 1-.12-1.26l.92-1.38a7.86 7.86 0 0 1-.62-1.43l-1.63-.33A1 1 0 0 1 3 14v-2a1 1 0 0 1 .8-.98l1.63-.33c.17-.5.37-.98.62-1.43l-.92-1.38a1 1 0 0 1 .12-1.26l1.37-1.37a1 1 0 0 1 1.26-.12l1.38.92c.45-.25.93-.45 1.43-.62l.33-1.63A1 1 0 0 1 12 3Zm0 2.25-.28 1.38a1 1 0 0 1-.74.77 5.85 5.85 0 0 0-1.94.8 1 1 0 0 1-1.07.02l-1.17-.78-.36.36.78 1.17a1 1 0 0 1-.02 1.07 5.85 5.85 0 0 0-.8 1.94 1 1 0 0 1-.77.74l-1.38.28v.5l1.38.28a1 1 0 0 1 .77.74c.18.68.45 1.33.8 1.94a1 1 0 0 1 .02 1.07l-.78 1.17.36.36 1.17-.78a1 1 0 0 1 1.07.02c.6.35 1.26.62 1.94.8a1 1 0 0 1 .74.77l.28 1.38h.5l.28-1.38a1 1 0 0 1 .74-.77 5.85 5.85 0 0 0 1.94-.8 1 1 0 0 1 1.07-.02l1.17.78.36-.36-.78-1.17a1 1 0 0 1 .02-1.07c.35-.6.62-1.26.8-1.94a1 1 0 0 1 .77-.74l1.38-.28v-.5l-1.38-.28a1 1 0 0 1-.77-.74 5.85 5.85 0 0 0-.8-1.94 1 1 0 0 1-.02-1.07l.78-1.17-.36-.36-1.17.78a1 1 0 0 1-1.07-.02 5.85 5.85 0 0 0-1.94-.8 1 1 0 0 1-.74-.77l-.28-1.38h-.5Z"/>
          </svg>
        </button>
      </header>

      <nav class="breadcrumb" id="breadcrumb" aria-label="完整分类路径"></nav>
      <section class="status" id="status" role="status">加载中...</section>
      <section class="content" aria-label="书签分类">
        <div class="columns" id="columns"></div>
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
